name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 20 不行：jsdom 依赖链里的 undici 用了 22.15+ 才有的 zlib zstd API
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # 95 条断言，纯 Node + jsdom，不开浏览器：抽屉 / 发现页 / 后台规则
      - run: npm test
